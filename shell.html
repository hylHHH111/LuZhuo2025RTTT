<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹭卓2025 RTTT巡演</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        body {
            background: linear-gradient(180deg, #a2d7fc 0%, #e4f5fd 50%, #ffffff 100%);
        }
        
        #bg-music {
            display: none;
        }
        
        .music-button-container {
            position: fixed;
            bottom: 26px;
            right: 34px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 9999;
        }

        @media (max-width: 768px) {
            .music-button-container {
                right: 16px;
                bottom: 155px;
            }
        }
        
        #music-control-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #42abf3;
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: none;
            transition: all 0.3s ease;
        }
        
        #music-control-btn:hover {
            transform: scale(1.1);
        }
        
        #content-frame {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>
    <audio id="bg-music" loop preload="auto">
        <source src="music/kanong.mp3" type="audio/mpeg">
    </audio>
    
    <div class="music-button-container" id="music-button-container">
        <button id="music-control-btn" aria-label="音乐控制">♪</button>
    </div>
    
    <iframe id="content-frame" name="content-frame" src="home.html"></iframe>
    
    <script>
        (function() {
            // 标记音频已经由 shell.html 控制
            window.bgMusicControlledByShell = true;
            
            var audio = document.getElementById('bg-music');
            var btn = document.getElementById('music-control-btn');
            var iframe = document.getElementById('content-frame');
            var isPlaying = false;
            
            function playMusic() {
                localStorage.setItem('userInteracted', 'true');
                audio.play().then(function() {
                    btn.innerHTML = '♪';
                    btn.style.background = '#42abf3';
                    isPlaying = true;
                }).catch(function(error) {
                    console.log('音频播放失败:', error);
                });
            }
            
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                if (isPlaying) {
                    audio.pause();
                    btn.innerHTML = '♫';
                    btn.style.background = 'rgba(150,150,150,0.9)';
                    isPlaying = false;
                } else {
                    playMusic();
                }
            });
            
            function tryAutoPlay() {
                var userInteracted = localStorage.getItem('userInteracted') === 'true';
                if (userInteracted) {
                    audio.play().then(function() {
                        btn.innerHTML = '♪';
                        btn.style.background = '#42abf3';
                        isPlaying = true;
                    }).catch(function() {});
                }
            }
            
            window.addEventListener('load', function() {
                setTimeout(tryAutoPlay, 500);
            });
            
            window.pauseBgMusic = function() {
                audio.pause();
                btn.innerHTML = '♫';
                btn.style.background = 'rgba(150,150,150,0.9)';
                isPlaying = false;
            };
            
            window.resumeBgMusic = function() {
                audio.play().then(function() {
                    btn.innerHTML = '♪';
                    btn.style.background = '#42abf3';
                    isPlaying = true;
                }).catch(function() {});
            };
            
            function injectFunctions() {
                try {
                    if (iframe.contentWindow) {
                        // 注入音乐控制函数
                        iframe.contentWindow.pauseBgMusic = window.pauseBgMusic;
                        iframe.contentWindow.resumeBgMusic = window.resumeBgMusic;
                        
                        // 注入标志，告诉 iframe 音频已经由 shell.html 控制
                        iframe.contentWindow.bgMusicControlledByShell = true;
                        
                        // 移除 iframe 中可能存在的重复音乐按钮
                        setTimeout(function() {
                            try {
                                var iframeBtn = iframe.contentWindow.document.getElementById('music-control-btn');
                                if (iframeBtn) {
                                    iframeBtn.remove();
                                    console.log('已移除 iframe 中的重复音乐按钮');
                                }
                            } catch(e) {}
                        }, 500);
                    }
                } catch(e) {
                    console.log('注入失败:', e);
                }
            }
            
            iframe.addEventListener('load', injectFunctions);
            window.addEventListener('load', function() {
                injectFunctions();
                setTimeout(injectFunctions, 100);
                setTimeout(injectFunctions, 500);
                setTimeout(injectFunctions, 1000);
            });
            
            window.addEventListener('message', function(event) {
                try {
                    if (event.data && event.data.action) {
                        switch(event.data.action) {
                            case 'pauseBgMusic':
                                window.pauseBgMusic();
                                break;
                            case 'resumeBgMusic':
                                window.resumeBgMusic();
                                break;
                            case 'playBgMusic':
                                if (!isPlaying) {
                                    playMusic();
                                }
                                break;
                        }
                    }
                } catch(e) {}
            });
            
        })();
    </script>
</body>
</html>
