<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹭卓2025 RTTT巡演</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        body {
            background: linear-gradient(180deg, #a2d7fc 0%, #e4f5fd 50%, #ffffff 100%);
        }
        
        /* 音乐播放器 - 隐藏 */
        #bg-music {
            display: none;
        }
        
        /* 音乐控制按钮容器 */
        .music-button-container {
            position: fixed;
            bottom: 26px;
            right: 34px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 9999;
        }
        
        /* 音乐控制按钮 */
        #music-control-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #42abf3;
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: none;
            transition: all 0.3s ease;
        }
        
        #music-control-btn:hover {
            transform: scale(1.1);
        }
        
        /* 内容区域 */
        #content-frame {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>
    <!-- 音乐播放器 -->
    <audio id="bg-music" loop preload="auto">
        <source src="music/kanong.mp3" type="audio/mpeg">
    </audio>
    
    <!-- 音乐控制按钮 -->
    <div class="music-button-container">
        <button id="music-control-btn" aria-label="音乐控制">♪</button>
    </div>
    
    <!-- 内容区域 - iframe -->
    <iframe id="content-frame" name="content-frame" src="home.html"></iframe>
    
    <script>
        (function() {
            var audio = document.getElementById('bg-music');
            var btn = document.getElementById('music-control-btn');
            var isPlaying = false;
            
            // 音乐控制
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                if (isPlaying) {
                    audio.pause();
                    btn.innerHTML = '♫';
                    btn.style.background = 'rgba(150,150,150,0.9)';
                    isPlaying = false;
                } else {
                    audio.play();
                    btn.innerHTML = '♪';
                    btn.style.background = '#42abf3';
                    isPlaying = true;
                }
            });
            
            // 尝试自动播放
            function tryAutoPlay() {
                // 检查用户是否有过交互
                var userInteracted = localStorage.getItem('userInteracted') === 'true';
                
                if (userInteracted) {
                    // 用户有过交互，可以自动播放
                    audio.play().then(function() {
                        btn.innerHTML = '♪';
                        btn.style.background = '#42abf3';
                        isPlaying = true;
                    }).catch(function() {
                        // 自动播放失败，等待用户交互
                        setupInteractionListener();
                    });
                } else {
                    // 用户没有交互，等待用户点击
                    setupInteractionListener();
                }
            }
            
            // 设置交互监听器 - 任何交互都能触发播放
            function setupInteractionListener() {
                function startMusic() {
                    // 记录用户交互
                    localStorage.setItem('userInteracted', 'true');
                    
                    audio.play().then(function() {
                        btn.innerHTML = '♪';
                        btn.style.background = '#42abf3';
                        isPlaying = true;
                    }).catch(function() {});
                    
                    // 移除所有交互监听器
                    document.removeEventListener('click', startMusic);
                    document.removeEventListener('touchstart', startMusic);
                    document.removeEventListener('touchmove', startMusic);
                    document.removeEventListener('mousedown', startMusic);
                    document.removeEventListener('keydown', startMusic);
                }
                
                // 添加多种交互监听器
                document.addEventListener('click', startMusic);
                document.addEventListener('touchstart', startMusic);
                document.addEventListener('touchmove', startMusic);
                document.addEventListener('mousedown', startMusic);
                document.addEventListener('keydown', startMusic);
            }
            
            // 始终添加交互监听器（确保任何情况下都能触发播放）
            setupInteractionListener();
            
            // 页面加载后尝试自动播放
            window.addEventListener('load', function() {
                setTimeout(tryAutoPlay, 500);
            });
            
            // 全局函数 - 供 iframe 内页面调用
            window.pauseBgMusic = function() {
                audio.pause();
                btn.innerHTML = '♫';
                btn.style.background = 'rgba(150,150,150,0.9)';
                isPlaying = false;
            };
            
            window.resumeBgMusic = function() {
                audio.play().then(function() {
                    btn.innerHTML = '♪';
                    btn.style.background = '#42abf3';
                    isPlaying = true;
                }).catch(function() {});
            };
            
            // 定期检查并注入函数到 iframe
            var iframe = document.getElementById('content-frame');
            
            function injectFunctions() {
                try {
                    if (iframe.contentWindow) {
                        iframe.contentWindow.pauseBgMusic = window.pauseBgMusic;
                        iframe.contentWindow.resumeBgMusic = window.resumeBgMusic;
                    }
                } catch(e) {}
            }
            
            // 多次尝试注入
            iframe.addEventListener('load', injectFunctions);
            window.addEventListener('load', function() {
                injectFunctions();
                setTimeout(injectFunctions, 100);
                setTimeout(injectFunctions, 500);
                setTimeout(injectFunctions, 1000);
            });
            
            // 监听来自 iframe 的消息
            window.addEventListener('message', function(event) {
                try {
                    if (event.data && event.data.action) {
                        switch(event.data.action) {
                            case 'pauseBgMusic':
                                window.pauseBgMusic();
                                break;
                            case 'resumeBgMusic':
                                window.resumeBgMusic();
                                break;
                        }
                    }
                } catch(e) {}
            });
            
        })();
    </script>
</body>
</html>
