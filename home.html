<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹭卓2025 RTTT巡演</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/city-page.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background: var(--white);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 首页头部 - 与成都页面结构一致 */
        .home-header {
            position: relative;
            min-height: 500px;
            padding-top: var(--nav-height);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 背景视频 */
        .header-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 视频遮罩层 */
        .header-video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        /* 微信播放提示层 */
        .wechat-play-hint {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            background: url('images/home.webp') center/cover no-repeat;
            cursor: pointer;
        }

        .play-hint-text {
            color: var(--white);
            font-size: var(--font-size-lg);
            padding: var(--space-md) var(--space-xl);
            background: transparent;
            border-radius: var(--radius-lg);
            backdrop-filter: blur(4px);
        }

        /* 导航栏 - 绝对定位在顶部，与成都页面一致 */
        .home-header .navbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: transparent !important;
            box-shadow: none !important;
            z-index: 9999;
        }

        .home-header .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--space-lg);
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            position: relative;
        }

        .home-header .navbar-logo-img {
            position: absolute;
            left: var(--space-lg);
            top: 50%;
            transform: translateY(-50%);
        }

        .navbar-logo-img {
            height: 37px;
            width: auto;
            object-fit: contain;
            margin-top: 4px;
        }

        .navbar-nav {
            display: flex;
            gap: var(--space-xs);
        }

        .nav-item {
            padding: var(--space-sm) var(--space-md);
            color: var(--white);
            text-decoration: none;
            font-size: var(--font-size-base);
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            position: relative;
        }

        .nav-item:hover {
            color: var(--accent-light);
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            color: var(--white);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--white);
            border-radius: var(--radius-full);
        }

        .navbar-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: var(--space-sm);
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1001;
        }

        .navbar-toggle span {
            width: 24px;
            height: 2px;
            background: var(--white);
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        /* 头部内容 */
        .header-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: var(--space-sm) var(--space-lg);
            z-index: 2;
        }

        .header-subtitle {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 0;
            letter-spacing: 5px;
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
        }

        /* 主内容区 */
        .main-content {
            padding: var(--space-xl) var(--space-lg);
            background: linear-gradient(180deg, var(--primary-bg) 0%, var(--white) 100%);
        }

        /* 视频区域 - 非全屏 */
        .video-section {
            max-width: 900px;
            margin: 0 auto;
        }

        .video-card {
            position: relative;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: transform var(--transition-base), box-shadow var(--transition-base);
            background: var(--white);
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow-hover);
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            overflow: hidden;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-base);
        }

        .video-card:hover .play-overlay {
            background: rgba(0, 0, 0, 0.2);
        }

        .play-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--primary);
            transition: transform var(--transition-base), background var(--transition-base);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .play-btn::before {
            content: '▶';
            margin-left: 5px;
        }

        .video-card:hover .play-btn {
            transform: scale(1.1);
            background: var(--white);
        }

        .video-info {
            padding: var(--space-lg);
            background: var(--white);
        }

        .video-title {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-xs);
        }

        .video-desc {
            font-size: var(--font-size-base);
            color: var(--text-secondary);
        }

        /* 页脚 */
        .footer {
            background: var(--primary);
            color: var(--white);
            padding: 10px var(--space-lg);
            text-align: center;
            margin-top: var(--space-2xl);
        }

        .footer-text {
            font-size: var(--font-size-base);
            color: var(--white);
            opacity: 0.9;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .navbar {
                background: transparent !important;
                z-index: 2147483647 !important;
                pointer-events: auto !important;
            }

            .navbar-container {
                position: relative;
                z-index: 9999;
                pointer-events: auto !important;
            }

            .navbar-toggle {
                position: relative;
                z-index: 10000;
                pointer-events: auto !important;
                cursor: pointer !important;
                display: flex !important;
            }

            .navbar-nav {
                display: none;
                position: absolute;
                top: 0;
                right: 0;
                left: auto;
                width: auto;
                background: transparent;
                flex-direction: column;
                padding-top: 50px;
                padding-right: var(--space-md);
                gap: var(--space-xs);
                z-index: 2147483647;
                align-items: flex-end;
            }

            .navbar-nav.active {
                display: flex;
            }

            .nav-item {
                text-align: right;
                width: auto;
                background: transparent;
                padding-top: 2px;
                padding-bottom: 2px;
            }

            .home-header {
                min-height: 380px;
            }

            .header-content {
                padding: var(--space-xs) var(--space-md);
            }

            .header-subtitle {
                letter-spacing: 1px;
                font-size: 0.9rem;
            }

            .play-btn {
                width: 60px;
                height: 60px;
                font-size: 22px;
            }

            .main-content {
                padding: var(--space-lg) var(--space-md);
            }
        }

        /* 光晕装饰 */
        .glow-decoration {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.3;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.4);
            top: 10%;
            left: -100px;
        }

        .glow-2 {
            width: 300px;
            height: 300px;
            background: rgba(162, 215, 252, 0.5);
            bottom: 10%;
            right: -50px;
        }

        /* ========== 回到顶部 ========== */
        .back-to-top {
            position: fixed;
            bottom: 72px;
            right: 20px;
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-base);
            border: none;
            font-size: 16px;
            z-index: 9998;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            background: var(--primary-light);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <!-- 首页头部 -->
    <header class="home-header">
        <!-- 背景视频 -->
        <video class="header-video" autoplay muted loop playsinline webkit-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false">
            <source src="home.mp4" type="video/mp4">
        </video>
        <!-- 视频遮罩层 -->
        <div class="header-video-overlay"></div>
        <!-- 微信播放提示层 -->
        <div class="wechat-play-hint" id="wechatPlayHint" style="display: none;">
            <div class="play-hint-text">点击任意位置开始播放</div>
        </div>

        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="navbar-container">
                <img src="images/Boxster.png" alt="RTTT巡演" class="navbar-logo-img" onerror="this.style.display='none'">
                <div class="navbar-nav" id="navbarNav">
                    <a href="home.html" class="nav-item active">首页</a>
                    <a href="chengdu.html" class="nav-item">成都站</a>
                    <a href="hefei.html" class="nav-item">合肥站</a>
                    <a href="taiyuan.html" class="nav-item">太原站</a>
                    <a href="beijing.html" class="nav-item">北京站</a>
                    <a href="nanjing.html" class="nav-item">南京站</a>
                    <a href="stage.html" class="nav-item">舞台直拍</a>
                    <a href="message.html" class="nav-item">留言鹭语</a>
                </div>
                <button class="navbar-toggle" id="navbarToggle" onclick="toggleMobileMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>

        <!-- 头部内容 -->
        <div class="header-content">
            <p class="header-subtitle"> - 鹭卓 2025 READY TO THE TOP巡演 - </p>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 视频区域 -->
        <div class="video-section">
            <div class="video-card" onclick="openVideoModal()">
                <div class="video-thumbnail">
                    <img src="images/home_video_cover.jpg" alt="巡演宣传片" onerror="this.style.display='none'">
                    <div class="play-overlay">
                        <div class="play-btn"></div>
                    </div>
                </div>
                <div class="video-info">
                    <div class="video-title">鹭卓2025RTTT演唱会纪录片</div>
                    <div class="video-desc">永远期待下一个翻天覆地的鹭卓</div>
                </div>
            </div>
        </div>
    </main>

    <!-- 回到顶部 -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</button>

    <!-- 页脚 -->
    <footer class="footer">
        <p class="footer-text">鹭卓2025 RTTT巡演记录 | ALL FOR LUZHUO</p>
    </footer>

    <!-- 视频播放模态框 -->
    <div id="videoModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 10000; align-items: center; justify-content: center;">
        <div style="position: relative; width: 90%; max-width: 1000px; aspect-ratio: 16/9;">
            <button onclick="closeVideoModal()" style="position: absolute; top: -40px; right: 0; background: none; border: none; color: white; font-size: 24px; cursor: pointer; z-index: 10001;">✕</button>
            <video id="homeVideo" controls style="width: 100%; height: 100%; border-radius: 12px;">
                <source src="videos/promo.mp4" type="video/mp4">
                您的浏览器不支持视频播放。
            </video>
        </div>
    </div>

    <script>
        // 移动端菜单切换
        function toggleMobileMenu() {
            const nav = document.getElementById('navbarNav');
            nav.classList.toggle('active');
        }

        // 打开视频模态框
        function openVideoModal() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('homeVideo');
            modal.style.display = 'flex';
            video.play();
        }

        // 关闭视频模态框
        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('homeVideo');
            modal.style.display = 'none';
            video.pause();
            video.currentTime = 0;
        }

        // 点击模态框背景关闭
        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeVideoModal();
            }
        });

        // 回到顶部功能
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // 监听滚动显示/隐藏回到顶部按钮
        window.addEventListener('scroll', function() {
            const backToTop = document.getElementById('backToTop');
            if (window.pageYOffset > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        // 视频自动播放处理（微信显示提示层，其他浏览器自动播放）
        (function() {
            const headerVideo = document.querySelector('.header-video');
            const playHint = document.getElementById('wechatPlayHint');
            if (!headerVideo) return;
            
            // 检测是否在微信浏览器中
            const isWechat = /MicroMessenger/i.test(navigator.userAgent);
            
            // 尝试播放视频
            const playVideo = function() {
                if (!headerVideo.paused) return Promise.resolve();
                return headerVideo.play().catch(function(e) {
                    console.log('视频自动播放被阻止:', e);
                    throw e;
                });
            };
            
            // 隐藏提示层
            const hideHint = function() {
                if (playHint) {
                    playHint.style.display = 'none';
                }
            };
            
            // 显示提示层
            const showHint = function() {
                if (playHint && isWechat) {
                    playHint.style.display = 'flex';
                }
            };
            
            if (isWechat) {
                // 微信环境：尝试自动播放，失败则显示提示层
                playVideo().then(function() {
                    // 播放成功，隐藏提示层
                    hideHint();
                }).catch(function() {
                    // 播放失败，显示提示层
                    showHint();
                });
                
                // 点击提示层播放视频
                if (playHint) {
                    playHint.addEventListener('click', function() {
                        playVideo().then(function() {
                            hideHint();
                        });
                    });
                }
                
                // 点击页面任意位置也尝试播放
                document.addEventListener('touchstart', function handler() {
                    playVideo().then(function() {
                        hideHint();
                    });
                    document.removeEventListener('touchstart', handler);
                }, { once: true });
                
            } else {
                // 非微信环境：正常自动播放
                playVideo();
                window.addEventListener('load', playVideo);
                setTimeout(playVideo, 100);
            }
        })();
    </script>
    <script src="js/music.js"></script>
</body>
</html>
