<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹭卓2025 RTTT巡演记录 - 首页</title>
    <link rel="stylesheet" href="css/variables.css">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            font-family: var(--font-family);
            background: transparent;
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        /* 导航栏 - 透明底，在banner内部 */
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: transparent !important;
            z-index: 100;
            box-shadow: none;
        }
        
        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--space-lg);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .navbar-logo {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            letter-spacing: 1px;
        }
        
        .navbar-nav {
            display: flex;
            gap: var(--space-xs);
        }
        
        .nav-item {
            padding: var(--space-sm) var(--space-md);
            color: var(--white);
            text-decoration: none;
            font-size: var(--font-size-base);
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            position: relative;
        }
        
        .nav-item:hover {
            color: var(--accent-light);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .nav-item.active {
            color: var(--white);
        }
        
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--white);
            border-radius: var(--radius-full);
        }
        
        /* 汉堡菜单 */
        .navbar-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: var(--space-sm);
            background: none;
            border: none;
            cursor: pointer;
        }
        
        .navbar-toggle span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--white);
            transition: all var(--transition-fast);
        }
        
        /* 主内容区 */
        .main-content {
            padding-top: 0;
        }

        /* Banner区域 */
        .banner {
            position: relative;
            height: 100vh;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .banner-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
        }
        
        .banner-content {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: var(--space-xl);
            max-width: 900px;
            margin-top: var(--nav-height);
        }
        
        .banner-title {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            color: var(--white);
            margin-bottom: var(--space-md);
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .banner-subtitle {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: var(--space-xl);
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .banner-desc {
            font-size: var(--font-size-lg);
            color: rgba(255, 255, 255, 0.85);
            line-height: 2;
            max-width: 700px;
            margin: 0 auto var(--space-2xl);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }
        
        .banner-btn {
            display: inline-block;
            padding: var(--space-md) var(--space-2xl);
            background: transparent;
            color: var(--white);
            font-size: var(--font-size-lg);
            font-weight: 600;
            border-radius: var(--radius-full);
            text-decoration: none;
            transition: all var(--transition-base);
            border: 2px solid rgba(255, 255, 255, 0.5);
            margin-top: 400px;
        }
        
        .banner-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }
        
        /* 响应式 */
        @media (max-width: 1024px) {
            .navbar {
                position: absolute !important;
                background: transparent !important;
                box-shadow: none !important;
            }

            .navbar-nav {
                position: fixed;
                top: 0;
                right: 0;
                left: auto;
                width: auto;
                padding: 45px 15px 15px !important;
                background: transparent;
                display: grid !important;
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 5px !important;
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
                transition: all var(--transition-base);
                pointer-events: none;
                z-index: 100000 !important;
            }

            .navbar-nav.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }

            .navbar-nav .nav-item {
                text-align: center !important;
                width: auto;
                background: transparent !important;
                padding: 2px 0px !important;
                border-radius: 8px !important;
                font-size: var(--font-size-base);
                color: var(--white);
            }

            .navbar-nav .nav-item:hover {
                background: rgba(255, 255, 255, 0.1) !important;
            }

            .navbar-toggle {
                display: flex !important;
                position: relative;
                z-index: 10000;
                cursor: pointer;
            }
            
            .city-line-svg {
                display: none;
            }
            
            .city-line-mobile {
                display: block;
            }
            
            .mobile-city-list {
                display: flex;
                flex-direction: column;
                gap: var(--space-lg);
                max-width: 400px;
                margin: 0 auto;
            }
            
            .mobile-city-item {
                display: flex;
                align-items: center;
                gap: var(--space-md);
                padding: var(--space-lg);
                background: linear-gradient(135deg, var(--accent-light) 0%, var(--white) 100%);
                border-radius: var(--radius-lg);
                border-left: 4px solid var(--primary);
                cursor: pointer;
                transition: all var(--transition-base);
                text-decoration: none;
                color: inherit;
            }
            
            .mobile-city-item:hover {
                transform: translateX(10px);
                box-shadow: var(--shadow-md);
            }
            
            .mobile-city-dot {
                width: 16px;
                height: 16px;
                background: var(--primary);
                border-radius: 50%;
                flex-shrink: 0;
            }
            
            .mobile-city-info {
                flex: 1;
            }
            
            .mobile-city-name {
                font-size: var(--font-size-lg);
                font-weight: 700;
                color: var(--primary);
            }
            
            .mobile-city-date {
                font-size: var(--font-size-sm);
                color: var(--text-secondary);
            }
        }
    </style>
</head>
<body>
    <!-- 主内容 -->
    <main class="main-content">
        <!-- Banner -->
        <section class="banner">
            <!-- 导航栏 - 在视频内部最顶端 -->
            <nav class="navbar">
                <div class="navbar-container">
                    <a href="home.html" class="navbar-logo">鹭卓2025RTTT巡演记录</a>
                    <div class="navbar-nav" id="navbarNav">
                        <a href="home.html" class="nav-item active">首页</a>
                        <a href="chengdu.html" class="nav-item">成都站</a>
                        <a href="hefei.html" class="nav-item">合肥站</a>
                        <a href="taiyuan.html" class="nav-item">太原站</a>
                        <a href="beijing.html" class="nav-item">北京站</a>
                        <a href="nanjing.html" class="nav-item">南京站</a>
                        <a href="stage.html" class="nav-item">舞台直拍</a>
                        <a href="message.html" class="nav-item">留言鹭语</a>
                    </div>
                    <button class="navbar-toggle" id="navbarToggle" onclick="toggleMobileMenu()">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </nav>
            <video class="banner-video" autoplay muted loop playsinline webkit-playsinline x5-playsinline>
                <source src="home.mp4" type="video/mp4">
                您的浏览器不支持视频播放
            </video>
            <div class="banner-overlay"></div>
            <div class="banner-content">
                <a href="chengdu.html" class="banner-btn">点击进入RTTT</a>
            </div>
        </section>


    </main>

    <script src="js/music.js"></script>
    <script>
        // 切换移动端菜单
        function toggleMobileMenu() {
            document.getElementById('navbarNav').classList.toggle('active');
        }



        // 点击导航项后关闭移动端菜单
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.getElementById('navbarNav').classList.remove('active');
            });
        });

        // 隐藏音乐控制按钮
        document.addEventListener('DOMContentLoaded', function() {
            var musicBtn = document.getElementById('music-control-btn');
            if (musicBtn) {
                musicBtn.style.display = 'none';
            }
        });

    </script>
</body>
</html>
