        document.addEventListener('DOMContentLoaded', function() {
            initBackToTop();

        // 打开合照区弹窗（太原站：前5张10月25日，后5张10月26日）
        function openGroupPhotoModal() {
            const groupPhotoData = navData.groupPhoto.map((img, i) => ({
                title: i < 5 ? `10月25日合照 ${i + 1}` : `10月26日合照 ${i - 4}`,
                image: img,
                thumb: img,
                isLeaf: true
            }));
            cardAlbum.openModal('合照区', groupPhotoData, 0);
        }

        // 打开花束区弹窗
        function openBouquetModal() {
            cardAlbum.openNavModal('花束区', navData.bouquet);
        }

        // 打开官摄区弹窗
        function openOfficialModal() {
            cardAlbum.openModal('官摄区', navData.official, 0);
        }

        // 打开海报花絮弹窗
        function openPosterModal() {
            cardAlbum.openPosterModal('海报花絮', posterData);
        }

        // 打开定妆照弹窗
        function openStylingModal() {
            cardAlbum.openModal('定妆照', stylingData, 0);
        }

        // 打开直拍区弹窗
        function openFancamModal(day) {
            if (day === 'day1') {
                const videoCount = cardAlbum.countVideos(fancamData[0].children);
                console.log('Day 1 video count:', videoCount);
                cardAlbum.currentModalType = 'stage-fancam';
                cardAlbum.openModal(`太原站 - DAY 1 舞台直拍`, fancamData[0].children, 0);
            } else {
                const videoCount = cardAlbum.countVideos(fancamData[1].children);
                console.log('Day 2 video count:', videoCount);
                
                // 手动统计调试
                let manualCount = 0;
                let songCounts = [];
                fancamData[1].children.forEach(song => {
                    if (song.children) {
                        let songVideoCount = 0;
                        song.children.forEach(video => {
                            if (video.video) {
                                manualCount++;
                                songVideoCount++;
                            }
                        });
                        songCounts.push({title: song.title, count: songVideoCount});
                    }
                });
                console.log('Day 2 manual count:', manualCount);
                console.log('Song counts:', songCounts);
                
                cardAlbum.currentModalType = 'stage-fancam';
                cardAlbum.openModal(`太原站 - DAY 2 舞台直拍`, fancamData[1].children, 0);
            }
        }

        // 打开图集弹窗 - 三层结构：Day -> 妆造名称 -> 图片
        function openGalleryModal(type) {
            const title = type === 'day1' ? '太原站 - DAY 1 站姐图集' : '太原站 - DAY 2 站姐图集';
            const data = type === 'day1' ? galleryData[0].children : galleryData[1].children;
            cardAlbum.openModal(title, data, 0);
        }
        
        // 播放视频
        function playVideo(videoUrl, title) {
            const modal = document.createElement('div');
            modal.className = 'video-modal';
            modal.innerHTML = `
                <div class="video-modal-overlay" onclick="closeVideoModal()"></div>
                <div class="video-modal-content">
                    <button class="video-modal-close" onclick="closeVideoModal()">×</button>
                    <h3 class="video-modal-title">${title}</h3>
                    <div class="video-iframe-container">
                        <iframe src="${videoUrl}" frameborder="0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';
        }
        
        // 关闭视频弹窗
        function closeVideoModal() {
            const modal = document.querySelector('.video-modal');
            if (modal) {
                modal.remove();
                document.body.style.overflow = '';
            }
        }
        
        // 打开纪录片弹窗
        function openDocumentaryModal() {
            playVideo('https://weibo.com/tv/show/1034:5303226933641232?from=old_pc_videoshow', '太原站纪录片');
        }
        
        // 打开海报信封区弹窗（太原站自定义标题）
        function openPosterNavModal() {
            const posterTitles = ['手写信信封', '太原站手写信', '主海报', '倒计时3天', '倒计时2天', '倒计时1天'];
            const posterData = navData.poster.map((img, i) => ({
                title: posterTitles[i] || `图片 ${i + 1}`,
                image: img,
                thumb: img,
                isLeaf: true
            }));
            cardAlbum.openModal('海报信封区', posterData, 0);
        }
        
        // 回到顶部
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // 初始化回到顶部按钮
        function initBackToTop() {
            const backToTop = document.getElementById('backToTop');
            if (backToTop) {
                window.addEventListener('scroll', function() {
                    if (window.pageYOffset > 300) {
                        backToTop.classList.add('visible');
                    } else {
                        backToTop.classList.remove('visible');
                    }
                });
            }
        }

        // 点击导航项后关闭移动端菜单
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.getElementById('navbarNav')?.classList.remove('active');
            });
        });

        // 滚动时自动关闭移动端导航栏
        let lastScrollY = window.scrollY;
        window.addEventListener('scroll', function() {
            const navbarNav = document.getElementById('navbarNav');
            if (navbarNav && navbarNav.classList.contains('active')) {
                if (Math.abs(window.scrollY - lastScrollY) > 5) {
                    navbarNav.classList.remove('active');
                }
            }
            lastScrollY = window.scrollY;
        }, { passive: true });

        // 点击页面其他地方关闭移动端导航栏
        document.addEventListener('click', function(e) {
            const navbarNav = document.getElementById('navbarNav');
            const navbarToggle = document.querySelector('.navbar-toggle');
            const isClickInNavbar = navbarNav && (navbarNav.contains(e.target) || navbarToggle.contains(e.target));
            
            if (!isClickInNavbar && navbarNav && navbarNav.classList.contains('active')) {
                navbarNav.classList.remove('active');
            }
        });
        
        // 页面加载后强制恢复音乐播放（防止视频区域误触暂停）
        (function() {
            function forceResumeMusic() {
                if (window.bgMusic && !window.bgMusicPlaying) {
                    window.bgMusicUserPaused = false;
                    window.bgMusicPausedByVideo = false;
                    
                    window.bgMusic.play().then(function() {
                        window.bgMusicPlaying = true;
                        if (window.updateMusicButtonState) {
                            window.updateMusicButtonState();
                        }
                        if (window.saveMusicState) {
                            window.saveMusicState();
                        }
                    }).catch(function(error) {
                        console.log('自动播放失败:', error);
                    });
                }
            }
            
            // 页面加载完成后尝试恢复音乐
            window.addEventListener('load', function() {
                setTimeout(forceResumeMusic, 100);
                setTimeout(forceResumeMusic, 500);
            });
            
            // 视频区域点击后恢复音乐（防止误触暂停）
            document.addEventListener('click', function(e) {
                var target = e.target;
                var isVideoCard = target.closest('.video-card, .video-thumbnail, .play-overlay');
                if (isVideoCard) {
                    setTimeout(forceResumeMusic, 50);
                }
            }, true);
        })();
    </script>
    <script src="js/music.js"></script>
    <script>
        // 滚动时持续恢复音乐播放
        (function() {
            function forceResumeMusic() {
                if (window.forceResumeBgMusic) {
                    window.forceResumeBgMusic();
                }
            }
            
            var scrollResumeTimer = null;
            function startScrollResume() {
                if (scrollResumeTimer) clearInterval(scrollResumeTimer);
                scrollResumeTimer = setInterval(forceResumeMusic, 30);
            }
            function stopScrollResume() {
                if (scrollResumeTimer) {
                    clearInterval(scrollResumeTimer);
                    scrollResumeTimer = null;
                }
            }
            
            document.addEventListener('touchstart', function() {
                startScrollResume();
            }, { passive: true });
            
            document.addEventListener('touchmove', function() {
                forceResumeMusic();
            }, { passive: true });
            
            document.addEventListener('touchend', function() {
                stopScrollResume();
                setTimeout(forceResumeMusic, 100);
            }, { passive: true });
            
            document.addEventListener('touchcancel', function() {
                stopScrollResume();
            }, { passive: true });
            
            window.addEventListener('scroll', function() {
                forceResumeMusic();
            }, { passive: true });
        })();
    </script>
