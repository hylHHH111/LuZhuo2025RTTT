<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹭卓2025 RTTT巡演记录 - 留言鹭语</title>
    <link rel="stylesheet" href="css/variables.css">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            font-family: var(--font-family);
            background: transparent;
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Header 区域 */
        .page-header {
            position: relative;
            height: 35vh;
            min-height: 250px;
            background: linear-gradient(180deg, #3d8bc8 0%, rgb(227, 245, 253) 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .page-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to top, rgb(227, 245, 253) 0%, transparent 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* 导航栏 */
        .navbar {
            position: relative;
            height: var(--nav-height);
            background: transparent !important;
            z-index: 100;
        }

        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--space-lg);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-logo {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .navbar-nav {
            display: flex;
            gap: var(--space-xs);
        }

        .nav-item {
            padding: var(--space-sm) var(--space-md);
            color: var(--white);
            text-decoration: none;
            font-size: var(--font-size-base);
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            position: relative;
        }

        .nav-item:hover {
            color: var(--accent-light);
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            color: var(--white);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--white);
            border-radius: var(--radius-full);
        }

        /* Header 内容 */
        .header-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: var(--space-xl);
            position: relative;
            z-index: 2;
        }

        .header-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            color: var(--white);
            margin-bottom: var(--space-sm);
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header-subtitle {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .navbar-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: var(--space-sm);
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1001;
        }

        .navbar-toggle span {
            width: 25px;
            height: 3px;
            background: var(--white);
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        /* 主内容区 */
        .main-content {
            padding: 0;
        }

        /* 留言板区域 */
        .guestbook-section {
            padding: var(--space-md) var(--space-lg) var(--space-xl);
            background: linear-gradient(180deg, var(--primary-bg) 0%, var(--white) 100%);
        }

        .guestbook-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            margin-bottom: var(--space-sm);
            letter-spacing: 2px;
        }

        .guestbook-subtitle {
            font-size: var(--font-size-lg);
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        /* 留言输入表单 */
        .guestbook-form {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: var(--shadow-md);
            margin-bottom: var(--space-xl);
        }

        .form-row {
            margin-bottom: var(--space-md);
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .guestbook-input {
            width: 100%;
            padding: var(--space-md);
            border: 2px solid var(--primary-lighter);
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            font-family: inherit;
            transition: all var(--transition-fast);
            background: var(--white);
        }

        .guestbook-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(66, 171, 243, 0.1);
        }

        .guestbook-textarea {
            width: 100%;
            min-height: 120px;
            padding: var(--space-md);
            border: 2px solid var(--primary-lighter);
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            font-family: inherit;
            resize: vertical;
            transition: all var(--transition-fast);
            background: var(--white);
        }

        .guestbook-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(66, 171, 243, 0.1);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .char-count {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }

        .guestbook-submit {
            padding: var(--space-sm) var(--space-xl);
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .guestbook-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .guestbook-submit:disabled {
            background: var(--text-light);
            cursor: not-allowed;
            transform: none;
        }

        .message-error {
            color: #e74c3c;
            font-size: var(--font-size-sm);
            margin-top: var(--space-sm);
            text-align: center;
        }

        .message-success {
            color: #27ae60;
            font-size: var(--font-size-sm);
            margin-top: var(--space-sm);
            text-align: center;
        }

        /* 管理功能 */
        .admin-section {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .admin-toggle {
            padding: var(--space-xs) var(--space-md);
            background: transparent;
            border: 1px solid var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .admin-toggle:hover {
            background: var(--primary-lighter);
        }

        .admin-panel {
            margin-top: var(--space-sm);
            display: flex;
            gap: var(--space-sm);
            justify-content: center;
            align-items: center;
        }

        .admin-input {
            padding: var(--space-sm);
            border: 1px solid var(--primary-lighter);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
        }

        .admin-confirm {
            padding: var(--space-sm) var(--space-md);
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            cursor: pointer;
        }

        /* 留言列表 */
        .messages-container {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: var(--shadow-md);
        }

        .messages-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
            padding-bottom: var(--space-md);
            border-bottom: 2px solid var(--primary-lighter);
        }

        .messages-count {
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--primary);
        }

        .messages-limit {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }

        .messages-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .message-item {
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--white) 100%);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            border-left: 4px solid var(--primary);
            position: relative;
            transition: all var(--transition-fast);
        }

        .message-item:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-sm);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-sm);
        }

        .message-nickname {
            font-weight: 600;
            color: var(--primary);
            font-size: var(--font-size-base);
        }

        .message-time {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }

        .message-content {
            color: var(--text-primary);
            line-height: 1.8;
            word-wrap: break-word;
        }

        .message-delete {
            position: absolute;
            top: var(--space-sm);
            right: var(--space-sm);
            background: #e74c3c;
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            padding: var(--space-xs) var(--space-sm);
            font-size: var(--font-size-sm);
            cursor: pointer;
            opacity: 0;
            transition: all var(--transition-fast);
        }

        .message-item:hover .message-delete {
            opacity: 1;
        }

        .message-delete:hover {
            background: #c0392b;
        }

        .loading-tip,
        .empty-tip {
            text-align: center;
            padding: var(--space-xl);
            color: var(--text-secondary);
            font-size: var(--font-size-base);
        }

        /* 页脚 */
        .footer {
            background: var(--primary-dark);
            color: var(--white);
            padding: var(--space-xl) var(--space-lg);
            text-align: center;
        }

        .footer-text {
            font-size: var(--font-size-sm);
            opacity: 0.9;
        }

        /* 回到顶部 */
        .back-to-top {
            position: fixed;
            bottom: 72px;
            right: 20px;
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-md);
            z-index: 999;
            font-size: 16px;
            border: none;
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .navbar {
                position: absolute !important;
                background: transparent !important;
                box-shadow: none !important;
            }

            .navbar-nav {
                position: fixed;
                top: 0;
                right: 0;
                left: auto;
                width: auto;
                padding: 45px 15px 15px !important;
                background: transparent;
                display: grid !important;
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 5px !important;
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
                transition: all var(--transition-base);
                pointer-events: none;
                z-index: 100000 !important;
            }

            .navbar-nav.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }

            .navbar-nav .nav-item {
                text-align: center !important;
                width: auto;
                background: transparent !important;
                padding: 2px 0px !important;
                border-radius: 8px !important;
                font-size: var(--font-size-base);
                color: var(--white);
            }

            .navbar-nav .nav-item:hover {
                background: rgba(255, 255, 255, 0.1) !important;
            }

            .navbar-toggle {
                display: flex !important;
                position: relative;
                z-index: 10000;
                cursor: pointer;
            }

            .banner {
                height: 40vh;
                min-height: 250px;
            }

            .guestbook-section {
                padding: var(--space-xl) var(--space-md);
            }

            .guestbook-form,
            .messages-container {
                padding: var(--space-lg);
            }

            .form-actions {
                flex-direction: column;
                gap: var(--space-sm);
                align-items: stretch;
            }

            .char-count {
                text-align: center;
            }

            .guestbook-submit {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .banner-title {
                font-size: 1.8rem;
            }

            .guestbook-form,
            .messages-container {
                padding: var(--space-md);
            }

            .message-header {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-xs);
            }

            .message-delete {
                opacity: 1;
                position: static;
                margin-top: var(--space-sm);
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <!-- Header 区域 -->
    <header class="page-header">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="navbar-container">
                <a href="home.html" class="navbar-logo">鹭卓2025RTTT巡演记录</a>
                <div class="navbar-nav" id="navbarNav">
                    <a href="home.html" class="nav-item">首页</a>
                    <a href="chengdu.html" class="nav-item">成都站</a>
                    <a href="hefei.html" class="nav-item">合肥站</a>
                    <a href="taiyuan.html" class="nav-item">太原站</a>
                    <a href="beijing.html" class="nav-item">北京站</a>
                    <a href="nanjing.html" class="nav-item">南京站</a>
                    <a href="stage.html" class="nav-item">舞台直拍</a>
                    <a href="message.html" class="nav-item active">留言鹭语</a>
                </div>
                <button class="navbar-toggle" id="navbarToggle" onclick="toggleMobileMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>
        <div class="header-content">
            <h1 class="header-title">留言鹭语</h1>
            <p class="header-subtitle">留下你想说的话</p>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="main-content">
        <!-- 留言板区域 -->
        <section class="guestbook-section" id="guestbook">
            <div class="guestbook-container">

                <!-- 留言输入表单 -->
                <div class="guestbook-form">
                    <div class="form-row">
                        <input type="text" id="nicknameInput" class="guestbook-input" placeholder="输入昵称（选填，最多10字）" maxlength="10">
                    </div>
                    <div class="form-row">
                        <textarea id="contentInput" class="guestbook-textarea" placeholder="写下你的留言..." maxlength="500"></textarea>
                    </div>
                    <div class="form-row form-actions">
                        <span class="char-count"><span id="charCount">0</span>/500</span>
                        <button class="guestbook-submit" onclick="submitMessage()">发布留言</button>
                    </div>
                    <div id="messageError" class="message-error"></div>
                </div>

                <!-- 管理功能 -->
                <div class="admin-section">
                    <button class="admin-toggle" onclick="toggleAdminMode()">管理模式</button>
                    <div id="adminPanel" class="admin-panel" style="display: none;">
                        <input type="password" id="adminKeyInput" class="admin-input" placeholder="输入管理密钥">
                        <button class="admin-confirm" onclick="verifyAdminKey()">确认</button>
                    </div>
                </div>

                <!-- 留言列表 -->
                <div class="messages-container">
                    <div class="messages-header">
                        <span class="messages-count">共 <span id="messageTotal">0</span> 条留言</span>
                        <span class="messages-limit">（最多显示222条）</span>
                    </div>
                    <div id="messagesList" class="messages-list">
                        <!-- 留言将在这里动态显示 -->
                        <div class="loading-tip">正在加载留言...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <p class="footer-text">鹭卓2025 RTTT巡演记录 | For Luzhou，From 橘子suuoia_Lu</p>
    </footer>

    <!-- 回到顶部 -->
    <div class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</div>

    <script>
        // 切换移动端菜单
        function toggleMobileMenu() {
            document.getElementById('navbarNav').classList.toggle('active');
        }

        // 回到顶部
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 显示/隐藏回到顶部按钮
        window.addEventListener('scroll', () => {
            const backToTop = document.getElementById('backToTop');
            if (window.scrollY > 500) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        // 点击导航项后关闭移动端菜单
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.getElementById('navbarNav').classList.remove('active');
            });
        });

        // ==================== 留言板功能 ====================

        // API 地址（使用相对路径，适配 Pages Functions）
        const WORKER_URL = '';

        // 管理密钥（需要与 worker.js 中的一致）
        const ADMIN_KEY = '19951124';

        // 敏感词列表（前端预检）
        const SENSITIVE_WORDS = [
            '傻逼', '傻B', 'sb', 'SB', '妈的', '他妈', '草泥马', '操', '垃圾', '去死',
            '滚', '贱', '蠢', '笨', '丑', '恶心', '废物', '脑残', '神经病', '变态',
            '诈骗', '骗子', '赌博', '毒品', '色情', '暴力', '恐怖', '邪教', '反动','沅','卓沅','2699','沅儿','劳尔','抄袭'
        ];

        // 管理员验证状态
        let adminVerified = false;

        // 页面加载时获取留言
        document.addEventListener('DOMContentLoaded', () => {
            fetchMessages();

            // 字符计数
            const contentInput = document.getElementById('contentInput');
            const charCount = document.getElementById('charCount');

            contentInput.addEventListener('input', () => {
                charCount.textContent = contentInput.value.length;
            });
        });

        // 获取留言列表
        async function fetchMessages() {
            try {
                const response = await fetch(`${WORKER_URL}/api/messages`);
                if (response.ok) {
                    const data = await response.json();
                    displayMessages(data.messages);
                } else {
                    showError('加载留言失败');
                }
            } catch (error) {
                console.error('加载留言出错:', error);
                document.getElementById('messagesList').innerHTML =
                    '<div class="empty-tip">加载失败，请刷新页面重试</div>';
            }
        }

        // 显示留言列表
        function displayMessages(messages) {
            const container = document.getElementById('messagesList');
            const totalElement = document.getElementById('messageTotal');

            totalElement.textContent = messages.length;

            if (messages.length === 0) {
                container.innerHTML = '<div class="empty-tip">还没有留言，快来抢沙发吧~</div>';
                return;
            }

            container.innerHTML = messages.map(msg => `
                <div class="message-item" data-id="${msg.id}">
                    ${adminVerified ? `<button class="message-delete" onclick="deleteMessage('${msg.id}')">删除</button>` : ''}
                    <div class="message-header">
                        <span class="message-nickname">${escapeHtml(msg.nickname)}</span>
                        <span class="message-time">${formatTime(msg.timestamp)}</span>
                    </div>
                    <div class="message-content">${escapeHtml(msg.content)}</div>
                </div>
            `).join('');
        }

        // 提交留言
        async function submitMessage() {
            const nicknameInput = document.getElementById('nicknameInput');
            const contentInput = document.getElementById('contentInput');
            const errorDiv = document.getElementById('messageError');
            const submitBtn = document.querySelector('.guestbook-submit');

            const nickname = nicknameInput.value.trim() || '匿名粉丝';
            const content = contentInput.value.trim();

            // 验证
            if (!content) {
                showError('请输入留言内容');
                return;
            }

            if (content.length > 500) {
                showError('留言内容不能超过500字');
                return;
            }

            // 敏感词检查
            const hasSensitiveWord = SENSITIVE_WORDS.some(word =>
                content.toLowerCase().includes(word.toLowerCase()) ||
                nickname.toLowerCase().includes(word.toLowerCase())
            );

            if (hasSensitiveWord) {
                showError('您的留言包含敏感词，请重新输入');
                return;
            }

            // 提交按钮禁用
            submitBtn.disabled = true;
            submitBtn.textContent = '发布中...';

            try {
                const response = await fetch(`${WORKER_URL}/api/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ nickname, content })
                });

                if (response.ok) {
                    // 清空表单
                    nicknameInput.value = '';
                    contentInput.value = '';
                    document.getElementById('charCount').textContent = '0';
                    errorDiv.textContent = '';

                    // 显示成功提示
                    const successDiv = document.createElement('div');
                    successDiv.className = 'message-success';
                    successDiv.textContent = '留言发布成功！';
                    errorDiv.parentNode.insertBefore(successDiv, errorDiv);
                    setTimeout(() => successDiv.remove(), 3000);

                    // 重新加载留言
                    fetchMessages();
                } else {
                    const error = await response.json();
                    showError(error.error || '发布失败，请重试');
                }
            } catch (error) {
                console.error('发布留言出错:', error);
                showError('网络错误，请检查网络连接');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '发布留言';
            }
        }

        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('messageError');
            errorDiv.textContent = message;
        }

        // 切换管理模式
        function toggleAdminMode() {
            const adminPanel = document.getElementById('adminPanel');
            adminPanel.style.display = adminPanel.style.display === 'none' ? 'flex' : 'none';
        }

        // 验证管理密钥
        function verifyAdminKey() {
            const input = document.getElementById('adminKeyInput');
            if (input.value === ADMIN_KEY) {
                adminVerified = true;
                input.value = '';
                document.getElementById('adminPanel').style.display = 'none';
                fetchMessages(); // 重新加载以显示删除按钮
                alert('管理验证成功！现在可以删除留言了');
            } else {
                alert('密钥错误');
            }
        }

        // 删除留言
        async function deleteMessage(messageId) {
            if (!confirm('确定要删除这条留言吗？')) {
                return;
            }

            try {
                const response = await fetch(`${WORKER_URL}/api/messages`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ id: messageId, adminKey: ADMIN_KEY })
                });

                if (response.ok) {
                    fetchMessages();
                } else {
                    alert('删除失败');
                }
            } catch (error) {
                console.error('删除留言出错:', error);
                alert('删除失败');
            }
        }

        // HTML转义函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 格式化时间
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;

            // 小于1小时显示"X分钟前"
            if (diff < 60000) {
                return '刚刚';
            } else if (diff < 3600000) {
                return Math.floor(diff / 60000) + '分钟前';
            } else if (diff < 86400000) {
                return Math.floor(diff / 3600000) + '小时前';
            } else if (diff < 604800000) {
                return Math.floor(diff / 86400000) + '天前';
            } else {
                return date.toLocaleDateString('zh-CN');
            }
        }
    </script>
    <script src="js/music.js"></script>
</body>
