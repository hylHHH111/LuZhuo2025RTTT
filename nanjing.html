        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initVideoPlayer();
            initBackToTop();
        });
        
        function initVideoPlayer() {
            const videoContainer = document.getElementById('documentaryVideo');
            if (videoContainer && typeof createVideoPlayer === 'function') {
                createVideoPlayer('documentaryVideo', {
                    src: 'assets/videos/nanjing/documentary.mp4',
                    poster: 'assets/images/nanjing/doc-poster.jpg',
                    title: '南京站纪录片'
                });
            }
        }
        
        function initBackToTop() {
            const backToTop = document.getElementById('backToTop');
            if (!backToTop) return;
            window.addEventListener('scroll', function() {
                if (window.scrollY > 500) {
                    backToTop.classList.add('visible');
                } else {
                    backToTop.classList.remove('visible');
                }
            });
        }
        
        function toggleMobileMenu() {
            const navbarNav = document.getElementById('navbarNav');
            navbarNav?.classList.toggle('active');
        }
        
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function openGroupPhotoModal() {
            cardAlbum.openNavModal('合照区', navData.groupPhoto, { dates: ['11月22日', '11月23日'] });
        }
        
        function openBouquetModal() {
            cardAlbum.openNavModal('花束区', navData.bouquet);
        }
        
        function openOfficialModal() {
            cardAlbum.openModal('官摄区', navData.official, 0);
        }
        
        function openPosterModal() {
            cardAlbum.openPosterModal('海报花絮', posterData);
        }
        
        function openFancamModal(day) {
            if (day === 'day1') {
                const videoCount = cardAlbum.countVideos(fancamData[0].children);
                cardAlbum.currentModalType = 'stage-fancam';
                cardAlbum.openModal(`南京站 - DAY 1 舞台直拍`, fancamData[0].children, 0);
            } else {
                const videoCount = cardAlbum.countVideos(fancamData[1].children);
                cardAlbum.currentModalType = 'stage-fancam';
                cardAlbum.openModal(`南京站 - DAY 2 舞台直拍`, fancamData[1].children, 0);
            }
        }
        
        // 打开定妆照弹窗
        function openStylingModal() {
            cardAlbum.openModal('定妆照', stylingData, 0);
        }
        
        function openGalleryModal(type) {
            let data, title;
            switch(type) {
                case 'day1':
                    title = '南京站 - DAY 1 站姐图集';
                    data = galleryData[0].children;
                    break;
                case 'day2':
                    title = '南京站 - DAY 2 站姐图集';
                    data = galleryData[1].children;
                    break;
            }
            cardAlbum.openModal(title, data, 0);
        }
        
        // 播放视频
        function playVideo(videoUrl, title) {
            const modal = document.createElement('div');
            modal.className = 'video-modal';
            modal.innerHTML = `
                <div class="video-modal-overlay" onclick="closeVideoModal()"></div>
                <div class="video-modal-content">
                    <button class="video-modal-close" onclick="closeVideoModal()">×</button>
                    <h3 class="video-modal-title">${title}</h3>
                    <div class="video-iframe-container">
                        <iframe src="${videoUrl}" frameborder="0" scrolling="no" allowfullscreen></iframe>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';
        }
        
        // 关闭视频弹窗
        function closeVideoModal() {
            const modal = document.querySelector('.video-modal');
            if (modal) {
                modal.remove();
                document.body.style.overflow = '';
            }
        }
        
        // 打开纪录片弹窗
        function openDocumentaryModal() {
            playVideo('https://weibo.com/tv/show/1034:5290871923343395?from=old_pc_videoshow', '南京站纪录片');
        }
        
        // 打开海报信封区弹窗
        function openPosterNavModal() {
            const posterTitles = ['手写信信封', '南京站手写信', '主海报', '倒计时3天', '倒计时2天', '倒计时1天'];
            const posterData = navData.poster.map((img, i) => ({
                title: posterTitles[i] || `图片 ${i + 1}`,
                image: img.image || img,
                thumb: img.thumb || img.image || img,
                isLeaf: true
            }));
            cardAlbum.openModal('南京站手封信', posterData, 0);
        }
        
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.getElementById('navbarNav')?.classList.remove('active');
            });
        });

        // 滚动时自动关闭移动端导航栏
        let lastScrollY = window.scrollY;
        window.addEventListener('scroll', function() {
            const navbarNav = document.getElementById('navbarNav');
            if (navbarNav && navbarNav.classList.contains('active')) {
                if (Math.abs(window.scrollY - lastScrollY) > 5) {
                    navbarNav.classList.remove('active');
                }
            }
            lastScrollY = window.scrollY;
        }, { passive: true });

        // 点击页面其他地方关闭移动端导航栏
        document.addEventListener('click', function(e) {
            const navbarNav = document.getElementById('navbarNav');
            const navbarToggle = document.querySelector('.navbar-toggle');
            const isClickInNavbar = navbarNav && (navbarNav.contains(e.target) || navbarToggle.contains(e.target));
            
            if (!isClickInNavbar && navbarNav && navbarNav.classList.contains('active')) {
                navbarNav.classList.remove('active');
            }
        });
    </script>
