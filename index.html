<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>鹭卓2025 RTTT巡演</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* 新配色方案 - 高级感蓝色系 */
            --primary: #42abf3;
            --primary-light: #6ec0f8;
            --primary-lighter: #a2d7fc;
            --primary-lightest: #cdecff;
            --primary-bg: #e4f5fd;
            --white: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a5568;

            /* 兼容旧变量名 */
            --warm-cream: #e4f5fd;
            --warm-peach: #a2d7fc;
            --warm-coral: #42abf3;
            --warm-pink: #6ec0f8;
            --warm-brown: #1a1a2e;
            --warm-gold: #6ec0f8;
            --warm-mint: #a2d7fc;
            --warm-lavender: #e4f5fd;
            --paper-texture: rgba(255, 255, 255, 0.98);
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, var(--primary-lighter) 0%, var(--primary-bg) 50%, var(--white) 100%);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* 纸质纹理背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        /* 温暖的光晕效果 */
        .warm-glow {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            animation: floatGlow 10s ease-in-out infinite;
        }

        .warm-glow-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(66, 171, 243, 0.3) 0%, transparent 70%);
            top: -150px;
            right: -100px;
            animation-delay: 0s;
        }

        .warm-glow-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(162, 215, 252, 0.35) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            animation-delay: -5s;
        }

        .warm-glow-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -2s;
        }

        @keyframes floatGlow {
            0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            33% { transform: scale(1.1) translate(20px, -20px); opacity: 0.8; }
            66% { transform: scale(0.95) translate(-10px, 15px); opacity: 0.7; }
        }

        /* 手绘风格装饰元素 */
        .hand-drawn-element {
            position: fixed;
            pointer-events: none;
            z-index: 1;
        }

        /* 闪闪小圆点 */
        .sparkle-dot {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            animation: sparkle 1.9s ease-in-out infinite;
        }

        .sparkle-1 { width: 2px; height: 2px; background: #FFFFFF; top: 5%; left: 5%; animation-delay: 0s; }
        .sparkle-2 { width: 1px; height: 1px; background: #FFFFFF; top: 12%; left: 18%; animation-delay: 0.23s; }
        .sparkle-3 { width: 2px; height: 2px; background: #FFFFFF; top: 8%; left: 35%; animation-delay: 0.47s; }
        .sparkle-4 { width: 1px; height: 1px; background: #FFFFFF; top: 15%; left: 52%; animation-delay: 0.71s; }
        .sparkle-5 { width: 2px; height: 2px; background: #FFFFFF; top: 6%; left: 68%; animation-delay: 0.95s; }
        .sparkle-6 { width: 1px; height: 1px; background: #FFFFFF; top: 14%; left: 82%; animation-delay: 1.19s; }
        .sparkle-7 { width: 2px; height: 2px; background: #FFFFFF; top: 3%; left: 92%; animation-delay: 1.43s; }
        .sparkle-8 { width: 1px; height: 1px; background: #FFFFFF; top: 18%; left: 45%; animation-delay: 1.67s; }
        .sparkle-9 { width: 2px; height: 2px; background: #FFFFFF; top: 22%; left: 8%; animation-delay: 0.08s; }
        .sparkle-10 { width: 1px; height: 1px; background: #FFFFFF; top: 28%; left: 25%; animation-delay: 0.31s; }
        .sparkle-11 { width: 2px; height: 2px; background: #FFFFFF; top: 25%; left: 42%; animation-delay: 0.55s; }
        .sparkle-12 { width: 1px; height: 1px; background: #FFFFFF; top: 32%; left: 58%; animation-delay: 0.79s; }
        .sparkle-13 { width: 2px; height: 2px; background: #FFFFFF; top: 20%; left: 75%; animation-delay: 1.03s; }
        .sparkle-14 { width: 1px; height: 1px; background: #FFFFFF; top: 30%; left: 88%; animation-delay: 1.27s; }
        .sparkle-15 { width: 2px; height: 2px; background: #FFFFFF; top: 35%; left: 12%; animation-delay: 1.51s; }
        .sparkle-16 { width: 1px; height: 1px; background: #FFFFFF; top: 38%; left: 30%; animation-delay: 1.75s; }
        .sparkle-17 { width: 2px; height: 2px; background: #FFFFFF; top: 42%; left: 48%; animation-delay: 0.13s; }
        .sparkle-18 { width: 1px; height: 1px; background: #FFFFFF; top: 36%; left: 65%; animation-delay: 0.37s; }
        .sparkle-19 { width: 2px; height: 2px; background: #FFFFFF; top: 45%; left: 80%; animation-delay: 0.61s; }
        .sparkle-20 { width: 1px; height: 1px; background: #FFFFFF; top: 40%; left: 95%; animation-delay: 0.85s; }
        .sparkle-21 { width: 2px; height: 2px; background: #FFFFFF; top: 48%; left: 5%; animation-delay: 1.09s; }
        .sparkle-22 { width: 1px; height: 1px; background: #FFFFFF; top: 52%; left: 20%; animation-delay: 1.33s; }
        .sparkle-23 { width: 2px; height: 2px; background: #FFFFFF; top: 55%; left: 38%; animation-delay: 1.57s; }
        .sparkle-24 { width: 1px; height: 1px; background: #FFFFFF; top: 50%; left: 55%; animation-delay: 1.81s; }
        .sparkle-25 { width: 2px; height: 2px; background: #FFFFFF; top: 58%; left: 72%; animation-delay: 0.19s; }
        .sparkle-26 { width: 1px; height: 1px; background: #FFFFFF; top: 54%; left: 88%; animation-delay: 0.43s; }
        .sparkle-27 { width: 2px; height: 2px; background: #FFFFFF; top: 62%; left: 15%; animation-delay: 0.67s; }
        .sparkle-28 { width: 1px; height: 1px; background: #FFFFFF; top: 68%; left: 32%; animation-delay: 0.91s; }
        .sparkle-29 { width: 1px; height: 1px; background: #FFFFFF; top: 65%; left: 50%; animation-delay: 1.15s; }
        .sparkle-30 { width: 2px; height: 2px; background: #FFFFFF; top: 72%; left: 68%; animation-delay: 1.39s; }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 15px 3px rgba(255, 255, 255, 0.9), 0 0 30px 6px rgba(66, 171, 243, 0.4); }
        }

        /* 加载动画 - 简约风格 */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, var(--primary-lighter) 0%, var(--primary-bg) 50%, var(--white) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            transition: opacity 0.5s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            text-align: center;
            animation: fadeInUp 0.8s ease forwards;
        }

        .loader-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 48px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 8px;
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.2s forwards;
        }

        .loader-subtitle {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--primary-light);
            letter-spacing: 4px;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.4s forwards;
        }

        .loader-line {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
            margin: 0 auto 24px;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.6s forwards, lineShimmer 0.7s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .loader-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            animation: shimmer 0.7s ease-in-out infinite;
        }

        /* 进度条样式 */
        .progress-container {
            width: 280px;
            height: 4px;
            background: rgba(91, 164, 201, 0.2);
            border-radius: 2px;
            margin: 30px auto;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-light), var(--primary));
            border-radius: 2px;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(91, 164, 201, 0.5);
        }

        @keyframes lineShimmer {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .loader-text {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: var(--primary-lighter);
            letter-spacing: 6px;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.8s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .loader-title {
                font-size: 36px;
            }

            .loader-subtitle {
                font-size: 14px;
            }

            .progress-container {
                width: 240px;
            }
        }

        @media (max-width: 480px) {
            .loader-title {
                font-size: 28px;
            }

            .loader-subtitle {
                font-size: 12px;
            }

            .progress-container {
                width: 200px;
            }
        }

    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div id="loader">
        <!-- 温暖光晕背景 -->
        <div class="warm-glow warm-glow-1"></div>
        <div class="warm-glow warm-glow-2"></div>
        <div class="warm-glow warm-glow-3"></div>

        <!-- 闪闪小圆点 -->
        <div class="sparkle-dot sparkle-1"></div>
        <div class="sparkle-dot sparkle-2"></div>
        <div class="sparkle-dot sparkle-3"></div>
        <div class="sparkle-dot sparkle-4"></div>
        <div class="sparkle-dot sparkle-5"></div>
        <div class="sparkle-dot sparkle-6"></div>
        <div class="sparkle-dot sparkle-7"></div>
        <div class="sparkle-dot sparkle-8"></div>
        <div class="sparkle-dot sparkle-9"></div>
        <div class="sparkle-dot sparkle-10"></div>
        <div class="sparkle-dot sparkle-11"></div>
        <div class="sparkle-dot sparkle-12"></div>
        <div class="sparkle-dot sparkle-13"></div>
        <div class="sparkle-dot sparkle-14"></div>
        <div class="sparkle-dot sparkle-15"></div>
        <div class="sparkle-dot sparkle-16"></div>
        <div class="sparkle-dot sparkle-17"></div>
        <div class="sparkle-dot sparkle-18"></div>
        <div class="sparkle-dot sparkle-19"></div>
        <div class="sparkle-dot sparkle-20"></div>
        <div class="sparkle-dot sparkle-21"></div>
        <div class="sparkle-dot sparkle-22"></div>
        <div class="sparkle-dot sparkle-23"></div>
        <div class="sparkle-dot sparkle-24"></div>
        <div class="sparkle-dot sparkle-25"></div>
        <div class="sparkle-dot sparkle-26"></div>
        <div class="sparkle-dot sparkle-27"></div>
        <div class="sparkle-dot sparkle-28"></div>
        <div class="sparkle-dot sparkle-29"></div>
        <div class="sparkle-dot sparkle-30"></div>

        <div class="loader-content">
            <h1 class="loader-title">鹭卓</h1>
            <p class="loader-subtitle">- 2025 Ready To The Top巡回演唱会记鹭网站 -</p>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="loader-text" id="progressText">0%</p>
        </div>
    </div>
    
    <!-- 强制隐藏加载动画的备用脚本 -->
    <script>
        // 备用：无论如何6秒后强制隐藏加载动画
        setTimeout(function() {
            var loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }, 6000);
    </script>

    <script>
        // 5秒进度条动画 - 最终显示1124%
        function init() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            let progress = 0;
            const duration = 5000; // 5秒
            const interval = 50; // 每50ms更新一次
            const maxDisplay = 1124; // 最终显示值
            const increment = 100 / (duration / interval);

            const progressInterval = setInterval(() => {
                progress += increment;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(progressInterval);
                    // 进度完成后显示1124%
                    if (progressText) {
                        progressText.textContent = maxDisplay + '%';
                    }
                    // 进度条保持100%宽度
                    if (progressBar) {
                        progressBar.style.width = '100%';
                    }
                    // 延迟后跳转到 shell.html
                    setTimeout(() => {
                        window.location.href = 'shell.html';
                    }, 500);
                } else {
                    // 计算显示的百分比（从0到1124的映射）
                    const displayProgress = Math.floor(progress * (maxDisplay / 100));
                    if (progressBar) {
                        progressBar.style.width = progress + '%';
                    }
                    if (progressText) {
                        progressText.textContent = displayProgress + '%';
                    }
                }
            }, interval);
        }

        // 启动
        window.addEventListener('load', init);
        
        // 记录用户交互（用于解锁音频自动播放）
        function recordInteraction() {
            localStorage.setItem('userInteracted', 'true');
            document.removeEventListener('click', recordInteraction);
            document.removeEventListener('touchstart', recordInteraction);
        }
        document.addEventListener('click', recordInteraction);
        document.addEventListener('touchstart', recordInteraction);
    </script>
</body>
</html>
